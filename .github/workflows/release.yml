name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # MinVer needs the tags

    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '9.0.x'

    - name: Test
      run: dotnet test --configuration Release

    - name: Pack
      run: dotnet pack Fp.SharePoint --configuration Release --output out

    - name: Publish to nuget.org
      run: >
        dotnet nuget push "out/*.nupkg"
        --source https://api.nuget.org/v3/index.json
        --api-key "$NUGET_API_KEY" --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Create GitHub release
      run: gh release create "$GITHUB_REF_NAME" out/*.nupkg out/*.snupkg --title "Fp.SharePoint ${GITHUB_REF_NAME#v}" --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
